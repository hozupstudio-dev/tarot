<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>타로 연애운</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FBF7F2;
  --surface: #FFFFFF;
  --purple: #8B7BB8;
  --purple-light: #B8A9DC;
  --purple-dark: #6A5A98;
  --rose: #C4908E;
  --gold: #C9A96E;
  --gold-glow: rgba(201,169,110,0.5);
  --text: #2E2640;
  --text-mid: #5E5472;
  --text-soft: #9188A0;
  --border: #E8E0F0;
  --card-w: 72px;
  --card-h: 116px;
  --fan-radius: 300px;
}

body {
  font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

/* ── SCREENS ─────────────────────────────── */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
  overflow: hidden;
}
.screen.active { opacity: 1; pointer-events: all; }

/* ── HOME ────────────────────────────────── */
#screen-home {
  background: linear-gradient(160deg, #F5EEFF 0%, #FBF7F2 60%);
  justify-content: center;
  padding: 32px 24px 48px;
}
.home-deco { font-size: 64px; line-height: 1; margin-bottom: 16px; filter: drop-shadow(0 4px 12px rgba(139,123,184,0.3)); }
.home-title { font-size: 28px; font-weight: 700; color: var(--purple-dark); letter-spacing: -0.5px; margin-bottom: 6px; }
.home-sub { font-size: 14px; color: var(--text-soft); margin-bottom: 40px; line-height: 1.6; text-align: center; }

.fortune-cards { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
.fortune-btn {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px;
  padding: 18px 20px; display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 12px rgba(139,123,184,0.08); text-align: left;
}
.fortune-btn:active { transform: scale(0.97); }
.fortune-btn .icon { font-size: 32px; line-height: 1; flex-shrink: 0; }
.fortune-btn .label { flex: 1; }
.fortune-btn .label strong { display: block; font-size: 17px; font-weight: 700; color: var(--purple-dark); margin-bottom: 2px; }
.fortune-btn .label span { font-size: 12px; color: var(--text-soft); }
.fortune-btn .arrow { font-size: 18px; color: var(--purple-light); }
.fortune-btn[data-type="solo"] { border-color: #DCB8E8; }
.fortune-btn[data-type="couple"] { border-color: #E8B8C4; }
.fortune-btn[data-type="reunion"] { border-color: #B8D4E8; }

/* ── GUIDE ───────────────────────────────── */
#screen-guide { background: var(--bg); }
.screen-header {
  width: 100%; padding: 16px 20px 14px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
}
.back-btn {
  width: 36px; height: 36px; border: none; background: none;
  font-size: 22px; cursor: pointer; color: var(--text-mid);
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
}
.back-btn:active { background: var(--border); }
.screen-header h2 { font-size: 17px; font-weight: 700; color: var(--text); }

.guide-body { flex: 1; overflow-y: auto; padding: 20px 20px 24px; width: 100%; -webkit-overflow-scrolling: touch; }
.guide-intro { background: linear-gradient(135deg, #F0E8FF, #FFE8EE); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
.guide-intro .spread-name { font-size: 13px; font-weight: 600; color: var(--purple); margin-bottom: 6px; }
.guide-intro .spread-desc { font-size: 14px; color: var(--text-mid); line-height: 1.7; }
.guide-tip { margin-top: 20px; padding: 14px 16px; background: #FFF8E8; border-radius: 12px; border: 1px solid #F0DCA0; }
.guide-tip p { font-size: 13px; color: #7A6030; line-height: 1.7; }
.guide-tip p::before { content: "💡 "; }
.guide-start-btn {
  width: calc(100% - 40px); margin: 0 20px 32px; padding: 17px;
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 16px rgba(106,90,152,0.35); transition: all 0.2s; flex-shrink: 0;
}
.guide-start-btn:active { transform: scale(0.97); }

/* ── DRAW ────────────────────────────────── */
#screen-draw { background: linear-gradient(180deg, #F5EEFF 0%, #FBF7F2 100%); }

.draw-header {
  width: 100%; padding: 12px 20px 8px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.draw-hint-text { font-size: 12px; color: var(--text-soft); text-align: center; padding: 0 20px 8px; flex-shrink: 0; }

.draw-progress { display: flex; gap: 6px; padding: 0 20px 10px; justify-content: center; flex-shrink: 0; }
.progress-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
.progress-dot.done { background: var(--purple); }
.progress-dot.current { background: var(--gold); }

/* drawn slots */
.drawn-slots { display: flex; gap: 10px; padding: 8px 20px 12px; justify-content: center; flex-shrink: 0; flex-wrap: wrap; }
.slot {
  width: 54px; height: 86px; border-radius: 8px; border: 2px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.5); position: relative; transition: all 0.3s;
}
.slot.filled { border-style: solid; border-color: var(--purple-light); }
.slot .slot-num { font-size: 10px; color: var(--text-soft); position: absolute; bottom: 3px; }
.slot .mini-card { width: 100%; height: 100%; border-radius: 6px; background: linear-gradient(135deg, var(--purple), var(--purple-dark)); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.slot.active { border-color: var(--gold); border-style: solid; box-shadow: 0 0 0 3px rgba(201,169,110,0.3); }

/* fan area */
.fan-area { flex: 1; position: relative; width: 100%; overflow: hidden; min-height: 200px; }

/* selection zone indicator */
.selection-zone {
  position: absolute;
  z-index: 60;
  pointer-events: none;
  border: 3px solid var(--gold);
  border-radius: 9px;
  background: rgba(201,169,110,0.06);
  box-shadow: 0 0 24px rgba(201,169,110,0.5), inset 0 0 16px rgba(201,169,110,0.05);
}
.zone-label {
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
  background: rgba(255,255,255,0.95);
  padding: 2px 10px;
  border-radius: 8px;
  letter-spacing: 0.3px;
  white-space: nowrap;
  box-shadow: 0 1px 6px rgba(201,169,110,0.25);
}

.fan-pivot {
  position: absolute;
  bottom: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
}

.fan-card {
  position: absolute;
  width: var(--card-w);
  height: var(--card-h);
  left: calc(var(--card-w) / -2);
  bottom: 0;
  transform-origin: center bottom;
  cursor: pointer;
  border-radius: 9px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.22);
  -webkit-tap-highlight-color: transparent;
  will-change: transform, opacity;
}
.fan-card .card-inner {
  width: 100%; height: 100%; border-radius: 9px;
  background: linear-gradient(148deg, #A898E0 0%, #7060B8 45%, #8B4E96 100%);
  border: 2.5px solid rgba(255,255,255,0.38);
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.fan-card .card-inner::before {
  content: ''; position: absolute; inset: 5px;
  border: 1px solid rgba(255,255,255,0.22); border-radius: 5px;
}
.fan-card .card-inner .card-symbol {
  font-size: 22px; color: rgba(255,255,255,0.32); position: relative; z-index: 1;
}
.fan-card .card-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: 9px; opacity: 0.9;
}
.fan-card.selectable .card-inner {
  border-color: rgba(255,210,80,0.95);
  box-shadow: 0 0 18px rgba(255,190,40,0.7), 0 0 6px rgba(255,190,40,0.4);
}
.fan-card.selected { opacity: 0 !important; pointer-events: none !important; }
.fan-drag-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-soft); white-space: nowrap; pointer-events: none; }

/* ── RESULT ──────────────────────────────── */
#screen-result { background: var(--bg); }
.result-body { flex: 1; overflow-y: auto; width: 100%; padding: 16px 16px 24px; -webkit-overflow-scrolling: touch; }
.result-title { font-size: 20px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 4px; }
.result-sub { font-size: 13px; color: var(--text-soft); text-align: center; margin-bottom: 20px; }

.result-card {
  background: var(--surface); border-radius: 18px; margin-bottom: 14px;
  overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid var(--border);
}
.result-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #F8F4FF, #FFF4F6);
}
.result-card-name { font-size: 16px; font-weight: 700; color: var(--text); }
.result-card-sub { font-size: 11px; color: var(--text-soft); margin-top: 1px; }
.reversed-badge { font-size: 11px; color: var(--rose); font-weight: 600; background: #FFE8E6; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }

.result-card-body { padding: 14px 16px; display: flex; gap: 14px; }
.result-card-art {
  width: 74px; height: 116px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 28px;
  color: rgba(255,255,255,0.5); border: 2px solid rgba(255,255,255,0.3);
  position: relative; overflow: hidden;
}
.result-card-art::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; }
.result-card-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
.result-card-text { flex: 1; }
.result-interp { font-size: 13.5px; color: var(--text-mid); line-height: 1.8; }

/* AI synthesis section */
.ai-section {
  background: var(--surface); border-radius: 18px; margin: 0 0 14px;
  border: 1.5px solid var(--purple-light); overflow: hidden;
}
.ai-section-header {
  padding: 14px 16px; background: linear-gradient(135deg, #EDE8FF, #F5E8FF);
  display: flex; align-items: center; gap: 10px;
}
.ai-section-header h3 { font-size: 15px; font-weight: 700; color: var(--purple-dark); flex: 1; }
.ai-generate-btn {
  padding: 7px 16px; background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: #fff; border: none; border-radius: 20px; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.ai-generate-btn:active { transform: scale(0.95); }
.ai-generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.ai-content { padding: 14px 16px; font-size: 13.5px; color: var(--text-mid); line-height: 1.8; min-height: 60px; }
.ai-content.placeholder { color: var(--text-soft); font-style: italic; }

.result-actions { padding: 0 16px 16px; display: flex; gap: 10px; flex-shrink: 0; }
.result-again-btn, .result-home-btn { flex: 1; padding: 14px; border: none; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.result-again-btn { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff; box-shadow: 0 3px 12px rgba(106,90,152,0.3); }
.result-home-btn { background: var(--surface); color: var(--text-mid); border: 1.5px solid var(--border); }
.result-again-btn:active, .result-home-btn:active { transform: scale(0.97); }

/* API Key modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 500;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet {
  background: var(--surface); border-radius: 24px 24px 0 0; width: 100%;
  max-width: 480px; padding: 24px 24px 40px;
  transform: translateY(100%); transition: transform 0.3s ease;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.modal-sheet p { font-size: 13px; color: var(--text-soft); line-height: 1.6; margin-bottom: 20px; }
.modal-sheet input {
  width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 12px;
  font-size: 14px; color: var(--text); background: var(--bg); outline: none; margin-bottom: 12px;
}
.modal-sheet input:focus { border-color: var(--purple); }
.modal-save-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
}
.modal-cancel-btn {
  width: 100%; padding: 12px; background: none; border: none;
  color: var(--text-soft); font-size: 14px; cursor: pointer; margin-top: 8px;
}
.api-note { font-size: 11px; color: var(--text-soft); background: #FFF8E8; padding: 10px 12px; border-radius: 8px; line-height: 1.6; margin-bottom: 16px; }

/* loading spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
</style>
</head>

<!-- ═══════════════════════════════ HOME ══════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="home-deco">🔮</div>
  <div class="home-title">타로 연애운</div>
  <div class="home-sub">카드가 전하는 사랑의 이야기<br>어떤 운을 살펴볼까요?</div>
  <div class="fortune-cards">
    <button class="fortune-btn" data-type="solo" onclick="selectFortune('solo')">
      <span class="icon">🌸</span>
      <span class="label"><strong>솔로운</strong><span>나에게 찾아올 인연과 연애 에너지</span></span>
      <span class="arrow">›</span>
    </button>
    <button class="fortune-btn" data-type="couple" onclick="selectFortune('couple')">
      <span class="icon">💑</span>

      <span class="arrow">›</span>
    </button>

      <span class="icon">🌙</span>

      <span class="arrow">›</span>
    </button>
  </div>
</div>

<!-- ══════════════════════════════ GUIDE ══════════════════════════════════ -->
<div id="screen-guide" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <h2 id="guide-title">스프레드 가이드</h2>
  </div>
  <div class="guide-body" id="guide-body"></div>
  <button class="guide-start-btn" onclick="startDraw()">카드 뽑기 시작</button>
</div>

<!-- ══════════════════════════════ DRAW ═══════════════════════════════════ -->
<div id="screen-draw" class="screen">
  <div class="draw-header">
    <button class="back-btn" onclick="goGuide()">‹</button>
    <div style="flex:1"></div>
    <span id="draw-counter" style="font-size:13px;color:var(--text-soft)"></span>
  </div>

  <div class="draw-hint-text">노란 영역으로 카드를 이동해 선택하세요</div>
  <div class="draw-progress" id="draw-progress"></div>
  <div class="drawn-slots" id="drawn-slots"></div>

  <div class="fan-area" id="fan-area">
    <div class="selection-zone" id="selection-zone">
      <span class="zone-label">터치하여 선택</span>
    </div>
    <div class="fan-pivot" id="fan-pivot"></div>
    <div class="fan-drag-hint">← 스와이프하여 카드 탐색 →</div>
  </div>
</div>

<!-- ═════════════════════════════ RESULT ══════════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="goHome()">✕</button>
    <h2 id="result-type-title">연애운 결과</h2>
  </div>
  <div class="result-body" id="result-body"></div>
  <div class="result-actions">
    <button class="result-again-btn" onclick="restartSameFortune()">다시 뽑기</button>
    <button class="result-home-btn" onclick="goHome()">처음으로</button>
  </div>
</div>

<!-- API Key Modal -->
<div class="modal-overlay" id="api-modal">
  <div class="modal-sheet">
    <h3>🤖 AI 해석 설정</h3>
    <div class="api-note">
      API 키는 이 기기의 브라우저에만 저장되며 외부로 전송되지 않습니다.<br>
      Anthropic Console(console.anthropic.com)에서 발급받을 수 있습니다.
    </div>
    <p>Anthropic API 키를 입력하면 AI가 카드들을 종합해서 해석해 드립니다.</p>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
    <button class="modal-save-btn" onclick="saveApiKey()">저장하고 해석 생성</button>
    <button class="modal-cancel-btn" onclick="closeApiModal()">취소</button>
  </div>
</div>

let currentFortune = null;
let currentSpread  = null;
let drawnCards     = [];
let currentPosIdx  = 0;
let deck           = [];
let fanOffset      = 0;
let touchStartX    = 0;
let touchStartOff  = 0;
let isDragging     = false;
let velocity       = 0;
let lastTouchX     = 0;
let lastTouchTime  = 0;
let animFrameId    = null;
let fanCardEls     = [];
const TOTAL_CARDS   = 78;
const CARD_STEP_DEG = 5;
const FAN_HALF      = 90;
const FAN_RADIUS    = 300;
const PIVOT_OFFSET  = 30;    // pivot sits this many px below fan-area bottom

// IndexedDB for images
let imageDB = null;
function openImageDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('tarot-images', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('images');
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e);
  });
}
async function getCardImage(cardId) {
  if (!imageDB) imageDB = await openImageDB();
  return new Promise(resolve => {
    const tx  = imageDB.transaction('images', 'readonly');
    const req = tx.objectStore('images').get(cardId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror   = () => resolve(null);
  });
}

//  GUIDE → DRAW
// ═══════════════════════════════════════════════════════
function startDraw() {
  drawnCards    = [];
  currentPosIdx = 0;
  deck          = shuffleDeck();
  fanOffset     = centerOnCard(38); // start with middle card
  velocity      = 0;
  buildDrawUI();
  buildFan();
  updateDrawUI();
  showScreen('screen-draw');
  requestAnimationFrame(() => positionZone());
}

function shuffleDeck() {
  const a = Array.from({length:78}, (_,i) => i);
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function centerOnCard(idx) {
  // returns fanOffset such that card idx is at angle 0
  return FAN_HALF - idx * CARD_STEP_DEG;
}

function buildDrawUI() {
  const positions = currentSpread.positions;
  document.getElementById('draw-progress').innerHTML =
    positions.map((_,i) => `<div class="progress-dot" id="dot-${i}"></div>`).join('');
  document.getElementById('drawn-slots').innerHTML =
    positions.map((_,i) => `<div class="slot" id="slot-${i}"><span class="slot-num">${i+1}</span></div>`).join('');
}

function updateDrawUI() {
  const positions = currentSpread.positions;
  document.getElementById('draw-counter').textContent = `${currentPosIdx+1} / ${positions.length}`;
  positions.forEach((_,i) => {
    const dot  = document.getElementById(`dot-${i}`);
    dot.className = 'progress-dot' + (i < currentPosIdx ? ' done' : i === currentPosIdx ? ' current' : '');
    const slot = document.getElementById(`slot-${i}`);
    slot.classList.toggle('active', i === currentPosIdx);
  });
}

// ═══════════════════════════════════════════════════════
//  SELECTION ZONE POSITIONING
// ═══════════════════════════════════════════════════════
function positionZone() {
  const fanArea = document.getElementById('fan-area');
  const zone    = document.getElementById('selection-zone');
  const areaH   = fanArea.offsetHeight;
  const areaW   = fanArea.offsetWidth;
  const CARD_W  = 72;
  const CARD_H  = 116;

  // center card: bottom is FAN_RADIUS above the pivot
  // pivot sits PIVOT_OFFSET below fan-area bottom
  // → card bottom from fan-area top = areaH + PIVOT_OFFSET - FAN_RADIUS
  const cardBottom = areaH + PIVOT_OFFSET - FAN_RADIUS;
  const cardTop    = cardBottom - CARD_H;
  const cardLeft   = (areaW - CARD_W) / 2;

  zone.style.top    = Math.max(0, cardTop)  + 'px';
  zone.style.left   = cardLeft              + 'px';
  zone.style.width  = CARD_W               + 'px';
  zone.style.height = CARD_H               + 'px';
}

// ═══════════════════════════════════════════════════════
//  FAN RENDERING
// ═══════════════════════════════════════════════════════
function buildFan() {
  const pivot = document.getElementById('fan-pivot');
  pivot.innerHTML = '';
  fanCardEls = [];
  for (let i = 0; i < 78; i++) {
    const el = document.createElement('div');
    el.className = 'fan-card';
    el.innerHTML = '<div class="card-inner"><span class="card-symbol">✦</span></div>';
    el.dataset.index = i;
    pivot.appendChild(el);
    fanCardEls.push(el);
  }
  renderFan();
  bindFanEvents();
  loadFanImages();
}

async function loadFanImages() {
  for (let i = 0; i < 78; i++) {
    const dataUrl = await getCardImage(i);
    if (dataUrl && fanCardEls[i]) {
      const inner = fanCardEls[i].querySelector('.card-inner');
      // remove symbol, add image
      inner.querySelector('.card-symbol').style.display = 'none';
      const img = document.createElement('img');
      img.src = dataUrl; img.className = 'card-img';
      inner.appendChild(img);
    }
  }
}

function getCardAngle(i) {
  return -FAN_HALF + i * CARD_STEP_DEG + fanOffset;
}

function getCenterCardIndex() {
  return Math.round((FAN_HALF - fanOffset) / CARD_STEP_DEG);
}

function renderFan() {
  const drawnSet = new Set(drawnCards.map(d => d.fanIndex));
  const centerIdx = getCenterCardIndex();

  fanCardEls.forEach((el, i) => {
    const angle    = getCardAngle(i);
    const absAngle = Math.abs(angle);

    if (absAngle > FAN_HALF + 8) { el.style.display = 'none'; return; }
    el.style.display = '';

    const isDrawn  = drawnSet.has(i);
    const isCenter = i === centerIdx && !isDrawn;

    // opacity: fade at edges, hide drawn
    let opacity = isDrawn ? 0 :
      absAngle > 75 ? Math.max(0, 1 - (absAngle - 75) / 18) : 1;

    el.style.zIndex    = Math.round(100 - absAngle);
    el.style.opacity   = opacity;
    el.style.transform = `rotate(${angle}deg) translateY(-${FAN_RADIUS}px)`;
    el.classList.toggle('selectable', isCenter);
    // only center card is clickable
    el.style.pointerEvents = (isCenter && !isDrawn) ? 'auto' : 'none';
  });
}

function clampOffset(val) {
  const maxOffset = FAN_HALF + CARD_STEP_DEG;
  const minOffset = -(TOTAL_CARDS - 1) * CARD_STEP_DEG + FAN_HALF - CARD_STEP_DEG;
  return Math.max(minOffset, Math.min(maxOffset, val));
}

// ═══════════════════════════════════════════════════════
//  TOUCH / MOUSE
// ═══════════════════════════════════════════════════════
function bindFanEvents() {
  const area = document.getElementById('fan-area');
  area.addEventListener('touchstart', onTouchStart, { passive: true });
  area.addEventListener('touchmove',  onTouchMove,  { passive: true });
  area.addEventListener('touchend',   onTouchEnd,   { passive: true });
  area.addEventListener('mousedown',  onMouseDown);
  // tap on the selection zone also selects
  document.getElementById('selection-zone').addEventListener('click', () => {
    const ci = getCenterCardIndex();
    if (ci >= 0 && ci < 78) selectCard(ci);
  });
}

function onTouchStart(e) {
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartOff = fanOffset;
  isDragging = false; velocity = 0;
  lastTouchX = t.clientX; lastTouchTime = Date.now();
  cancelAnimationFrame(animFrameId);
}
function onTouchMove(e) {
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  if (Math.abs(dx) > 5) isDragging = true;
  if (isDragging) {
    fanOffset = clampOffset(touchStartOff + dx / 5);
    renderFan();
    const now = Date.now(); const dt = now - lastTouchTime;
    if (dt > 0) velocity = (t.clientX - lastTouchX) / dt;
    lastTouchX = t.clientX; lastTouchTime = now;
  }
}
function onTouchEnd(e) {
  if (!isDragging) {
    const t = e.changedTouches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const card = el && el.closest('.fan-card');
    if (card && card.classList.contains('selectable'))
      selectCard(parseInt(card.dataset.index));
  } else {
    startMomentum();
  }
  isDragging = false;
}

function onMouseDown(e) {
  touchStartX = e.clientX; touchStartOff = fanOffset;
  isDragging = false; velocity = 0;
  lastTouchX = e.clientX; lastTouchTime = Date.now();
  cancelAnimationFrame(animFrameId);
  const onMove = ev => {
    const dx = ev.clientX - touchStartX;
    if (Math.abs(dx) > 5) isDragging = true;
    if (isDragging) {
      fanOffset = clampOffset(touchStartOff + dx / 5);
      renderFan();
      const now = Date.now(); const dt = now - lastTouchTime;
      if (dt > 0) velocity = (ev.clientX - lastTouchX) / dt;
      lastTouchX = ev.clientX; lastTouchTime = now;
    }
  };
  const onUp = ev => {
    if (!isDragging) {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const card = el && el.closest('.fan-card');
      if (card && card.classList.contains('selectable'))
        selectCard(parseInt(card.dataset.index));
    } else startMomentum();
    isDragging = false;
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

function startMomentum() {
  let velDeg = velocity / 5;
  function tick() {
    velDeg *= 0.92;
    if (Math.abs(velDeg) < 0.015) { snapToNearest(); return; }
    fanOffset = clampOffset(fanOffset + velDeg * 16);
    renderFan();
    animFrameId = requestAnimationFrame(tick);
  }
  animFrameId = requestAnimationFrame(tick);
}

function snapToNearest() {
  const nearest = Math.max(0, Math.min(77, getCenterCardIndex()));
  const target  = centerOnCard(nearest);
  const diff    = target - fanOffset;
  if (Math.abs(diff) < 0.1) return;
  function snap() {
    const remaining = target - fanOffset;
    if (Math.abs(remaining) < 0.3) { fanOffset = target; renderFan(); return; }
    fanOffset += remaining * 0.18;
    renderFan();
    animFrameId = requestAnimationFrame(snap);
  }
  animFrameId = requestAnimationFrame(snap);
}

// ═══════════════════════════════════════════════════════
//  CARD SELECTION
// ═══════════════════════════════════════════════════════
function selectCard(fanIndex) {
  if (currentPosIdx >= currentSpread.positions.length) return;
  const drawnSet = new Set(drawnCards.map(d => d.fanIndex));
  if (drawnSet.has(fanIndex)) return;

  const cardId  = deck[drawnCards.length];
  const reversed = Math.random() < 0.3;

  drawnCards.push({ fanIndex, card: CARDS[cardId], reversed, positionIndex: currentPosIdx });

  fanCardEls[fanIndex].classList.add('selected');

  const slot = document.getElementById(`slot-${currentPosIdx}`);
  slot.classList.add('filled');
  slot.innerHTML = '<div class="mini-card">✦</div>';

  currentPosIdx++;
  if (currentPosIdx >= currentSpread.positions.length) {
    setTimeout(() => showResult(), 700);
  } else {
    updateDrawUI();
    // snap to next undrawn center
    snapToNearest();
  }
}

  `;
  showScreen('screen-result');
}

  for (const drawn of drawnCards) {

    const rev   = drawn.reversed;
    const interp = getInterpretation(card.id, currentFortune, drawn.positionIndex, rev);
    const artStyle = getCardArtStyle(card);
    const imgSrc   = await getCardImage(card.id);

    html += `
      <div class="result-card">
        <div class="result-card-header">
          <div>
            <div class="result-card-name">${card.name}</div>
            <div class="result-card-sub">${card.nameEn}</div>
          </div>
          ${rev ? '<div class="reversed-badge">역방향</div>' : ''}
        </div>
        <div class="result-card-body">
          <div class="result-card-art" style="${artStyle}">
            ${imgSrc ? `<img src="${imgSrc}" alt="${card.name}">` : `<span>${getCardSymbol(card)}</span>`}
          </div>
          <div class="result-card-text">
            <div class="result-interp">${interp}</div>
          </div>
        </div>
      </div>`;
  }
  return html;
}

function getInterpretation(cardId, fortuneType, positionIndex, reversed) {
  const saved = JSON.parse(localStorage.getItem('tarot-interp') || '{}');
  const dir   = reversed ? 'rev' : 'norm';
  // position-specific first
  const key1  = `${cardId}_${fortuneType}_p${positionIndex}_${dir}`;
  if (saved[key1] && saved[key1].trim()) return saved[key1];
  // fallback: general (no position)
  const key2  = `${cardId}_${fortuneType}_${dir}`;
  if (saved[key2] && saved[key2].trim()) return saved[key2];
  return '이 카드에 대한 해석을 아직 작성하지 않았습니다. cards-editor.html 에서 작성해 주세요.';
}

function getCardArtStyle(card) {
  const g = {
    major:     'background: linear-gradient(145deg, #9B8FD4, #6050A8, #8B4E8C)',
    wands:     'background: linear-gradient(145deg, #E8A058, #C07830, #A05820)',
    cups:      'background: linear-gradient(145deg, #6898D8, #4878B8, #285898)',
    swords:    'background: linear-gradient(145deg, #88AACC, #6888AA, #486888)',
    pentacles: 'background: linear-gradient(145deg, #78B868, #589848, #387828)',
  };
  return g[card.arcana === 'major' ? 'major' : card.suit] || g.major;
}
function getCardSymbol(card) {
  if (card.arcana === 'major') return '★';
  return {wands:'🔥', cups:'💧', swords:'⚔️', pentacles:'⭐'}[card.suit] || '✦';
}

function restartSameFortune() { startDraw(); showScreen('screen-draw'); }

// ═══════════════════════════════════════════════════════
//  AI SYNTHESIS
// ═══════════════════════════════════════════════════════
function triggerAI() {
  const key = localStorage.getItem('anthropic-api-key');
  if (!key) { openApiModal(); return; }
  callAnthropicAPI(key);
}

function openApiModal() {
  const modal = document.getElementById('api-modal');
  const inp   = document.getElementById('api-key-input');
  inp.value   = localStorage.getItem('anthropic-api-key') || '';
  modal.classList.add('open');
}
function closeApiModal() { document.getElementById('api-modal').classList.remove('open'); }

function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) { alert('API 키를 입력해 주세요.'); return; }
  localStorage.setItem('anthropic-api-key', key);
  closeApiModal();
  callAnthropicAPI(key);
}

async function callAnthropicAPI(apiKey) {
  const btn     = document.getElementById('ai-btn');
  const content = document.getElementById('ai-content');
  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span>생성 중...';
  content.className = 'ai-content';
  content.textContent = 'AI가 카드를 해석하고 있습니다...';

  const cardLines = drawnCards.map((d, i) => {
    const interp = getInterpretation(d.card.id, currentFortune, d.positionIndex, d.reversed);
    return `카드 ${i+1}: ${d.card.name}${d.reversed ? ' (역방향)' : ''}\n해석: ${interp}`;
  }).join('\n\n');

  const userPrompt = `${currentSpread.label} 타로 리딩 결과입니다.\n\n${cardLines}\n\n위 카드들을 바탕으로 종합적인 해석과 구체적인 조언을 300자 이내로 작성해 주세요. 따뜻하고 공감적인 어조로 작성해 주세요.`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-allow-browser': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 600,
        system: '당신은 전문 타로 리더입니다. 사용자가 제공한 각 카드의 개별 해석을 바탕으로, 전체적으로 연결되는 종합 메시지를 한국어로 작성합니다. 카드 이름이나 해석을 단순히 반복하지 말고, 흐름을 읽어 하나의 이야기로 연결해 주세요.',
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    content.className   = 'ai-content';
    content.textContent = data.content[0].text;
  } catch (e) {
    content.className   = 'ai-content';
    content.textContent = `오류: ${e.message}`;
    if (e.message.includes('401') || e.message.includes('invalid')) {
      localStorage.removeItem('anthropic-api-key');
    }
  } finally {
    btn.disabled  = false;
    btn.innerHTML = '다시 생성';
  }
}

// close modal on overlay click
document.getElementById('api-modal').addEventListener('click', function(e) {
  if (e.target === this) closeApiModal();
});

// reposition zone on resize
window.addEventListener('resize', () => {
  if (document.getElementById('screen-draw').classList.contains('active')) positionZone();
});
</script>
