<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타로 카드 해석 에디터</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F8F5FF;
  --surface: #FFFFFF;
  --purple: #8B7BB8;
  --purple-dark: #6A5A98;
  --rose: #C4908E;
  --gold: #C9A96E;
  --text: #2E2640;
  --text-mid: #5E5472;
  --text-soft: #9188A0;
  --border: #E0D8F0;
  --sidebar-w: 280px;
}

body {
  font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ─────────────────────────────── */
.topbar {
  background: var(--purple-dark);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:active { transform: scale(0.96); }
.btn-outline {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.35);
}
.btn-outline:hover { background: rgba(255,255,255,0.25); }
.btn-gold {
  background: var(--gold);
  color: #fff;
}
.btn-gold:hover { background: #B8983D; }
.btn-save {
  background: #5CAD6C;
  color: #fff;
}
.btn-save:hover { background: #4A9C5A; }

/* ── LAYOUT ──────────────────────────────── */
.app-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 52px);
}

/* ── SIDEBAR ─────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.sidebar-search {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-search input {
  width: 100%;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  outline: none;
}
.sidebar-search input:focus { border-color: var(--purple); }

.filter-row {
  padding: 8px 12px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.filter-btn {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-mid);
  transition: all 0.15s;
}
.filter-btn.active {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
}

.card-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.list-section-header {
  padding: 10px 14px 4px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}

.list-item {
  padding: 9px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.1s;
  border-left: 3px solid transparent;
}
.list-item:hover { background: var(--bg); }
.list-item.active {
  background: #EDE8FF;
  border-left-color: var(--purple);
}
.list-item.has-data .item-dot { background: #5CAD6C; }
.list-item.partial-data .item-dot { background: var(--gold); }

.item-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
}
.item-name { font-size: 13px; color: var(--text); font-weight: 500; }
.item-en   { font-size: 11px; color: var(--text-soft); margin-top: 1px; }

/* ── MAIN EDITOR ─────────────────────────── */
.editor-main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.editor-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-soft);
  gap: 12px;
}
.editor-empty .icon { font-size: 48px; }
.editor-empty p { font-size: 14px; }

.editor-card-header {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
}

.card-art-preview {
  width: 64px; height: 100px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  color: rgba(255,255,255,0.6);
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
}
.card-art-preview::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px;
}

.card-header-info h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.card-header-info .en-name {
  font-size: 14px;
  color: var(--text-soft);
  margin-bottom: 8px;
}
.arcana-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}
.arcana-major { background: #EDE8FF; color: var(--purple-dark); }
.arcana-minor-wands { background: #FFF0E0; color: #A05820; }
.arcana-minor-cups { background: #E0EEFF; color: #285898; }
.arcana-minor-swords { background: #E8EEF5; color: #486888; }
.arcana-minor-pentacles { background: #E8F5E0; color: #387828; }

.progress-indicator {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.prog-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-soft);
}
.prog-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border);
}
.prog-dot.filled { background: #5CAD6C; }
.prog-dot.half   { background: var(--gold); }

/* Fortune type tabs */
.fortune-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border-radius: 10px;
  overflow: hidden;
  border: 1.5px solid var(--border);
}
.fortune-tab {
  flex: 1;
  padding: 10px;
  background: var(--surface);
  border: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.15s;
  border-right: 1px solid var(--border);
}
.fortune-tab:last-child { border-right: none; }
.fortune-tab.active {
  background: var(--purple);
  color: #fff;
}

/* Interpretation fields */
.interp-section {
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
  margin-bottom: 16px;
}

.interp-section-header {
  padding: 12px 16px;
  background: linear-gradient(135deg, #F5F0FF, #FFF5F5);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.interp-section-header h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.char-count { font-size: 11px; color: var(--text-soft); }

.interp-section textarea {
  width: 100%;
  padding: 14px 16px;
  border: none;
  font-size: 14px;
  line-height: 1.75;
  color: var(--text);
  background: var(--surface);
  resize: vertical;
  min-height: 100px;
  font-family: inherit;
  outline: none;
}
.interp-section textarea::placeholder { color: #C0B8CC; }
.interp-section textarea:focus {
  background: #FDFCFF;
}

.divider-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 16px;
  background: #FFF8E8;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: #8A7040;
  font-weight: 600;
}
.divider-label::before { content: '↕ 역방향 해석'; }

.interp-section .reversed-area {
  border-top: 1px dashed var(--border);
}

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-soft);
  padding: 8px 16px 0;
  letter-spacing: 0.3px;
}

/* Save indicator */
.save-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #2E2640;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
}
.save-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Responsive */
@media (max-width: 600px) {
  .sidebar { width: 220px; }
  .editor-main { padding: 16px; }
}
</style>
</head>

<div class="topbar">
  <h1>🔮 타로 카드 해석 에디터</h1>
  <div class="topbar-actions">
    <button class="btn btn-outline" onclick="exportData()">내보내기 (JSON)</button>
    <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">가져오기</button>
    <button class="btn btn-save" onclick="saveAll()">💾 저장</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <a href="index.html" class="btn btn-gold" style="text-decoration:none;">← 사이트 보기</a>
  </div>
</div>

<div class="app-layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="카드 이름 검색..." oninput="filterCards()">
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">전체</button>
      <button class="filter-btn" data-filter="major" onclick="setFilter('major', this)">메이저</button>
      <button class="filter-btn" data-filter="wands" onclick="setFilter('wands', this)">완드</button>
      <button class="filter-btn" data-filter="cups" onclick="setFilter('cups', this)">컵</button>
      <button class="filter-btn" data-filter="swords" onclick="setFilter('swords', this)">소드</button>
      <button class="filter-btn" data-filter="pentacles" onclick="setFilter('pentacles', this)">펜타클</button>
    </div>
    <div class="card-list" id="card-list"></div>
  </div>

  <!-- MAIN EDITOR -->
  <div class="editor-main" id="editor-main">
    <div class="editor-empty">
      <div class="icon">✨</div>
      <p>왼쪽에서 카드를 선택하세요</p>
      <p style="font-size:12px;margin-top:-4px;">총 78장의 카드 해석을 작성할 수 있습니다</p>
    </div>
  </div>
</div>

<div class="save-toast" id="save-toast">저장되었습니다</div>

  reunion: {
    norm: '이 카드가 재회를 원하는 내담자에게 전하는 메시지를 적어주세요.\n예) 상대방에게 과거의 감정이 아직 남아있으며, 새로운 시작의 가능성이 열려 있음을 나타냅니다...',
    rev:  '역방향일 때의 재회운 해석을 적어주세요.\n예) 재회에 대한 집착이 오히려 상대를 멀어지게 할 수 있습니다...',
  },
};

let currentFilter = 'all';
let currentCardId = null;
let currentFortune = 'solo';
let data = {};

function loadData() {
  data = JSON.parse(localStorage.getItem('tarot-interp') || '{}');
}

function saveData() {
  localStorage.setItem('tarot-interp', JSON.stringify(data));
}

function getDataStatus(cardId) {
  const total = FORTUNE_TYPES.length * 2; // norm + rev for each type
  let filled = 0;
  FORTUNE_TYPES.forEach(ft => {
    ['norm', 'rev'].forEach(dir => {
      const key = `${cardId}_${ft}_${dir}`;
      if (data[key] && data[key].trim()) filled++;
    });
  });
  if (filled === 0) return 'empty';
  if (filled === total) return 'full';
  return 'partial';
}

function getArtStyle(card) {
  const g = {
    major: 'linear-gradient(145deg, #9B8FD4, #6050A8, #8B4E8C)',
    wands: 'linear-gradient(145deg, #E8A058, #C07830, #A05820)',
    cups:  'linear-gradient(145deg, #6898D8, #4878B8, #285898)',
    swords:'linear-gradient(145deg, #88AACC, #6888AA, #486888)',
    pentacles: 'linear-gradient(145deg, #78B868, #589848, #387828)',
  };
  const k = card.arcana === 'major' ? 'major' : card.suit;
  return `background: ${g[k] || g.major}`;
}
function getCardSymbol(card) {
  if (card.arcana === 'major') return '★';
  return { wands:'🔥', cups:'💧', swords:'⚔️', pentacles:'⭐' }[card.suit] || '✦';
}
function getArcanaBadgeClass(card) {
  if (card.arcana === 'major') return 'arcana-major';
  return `arcana-minor-${card.suit}`;
}
function getArcanaBadgeLabel(card) {
  if (card.arcana === 'major') return '메이저 아르카나';
  const suits = { wands:'완드', cups:'컵', swords:'소드', pentacles:'펜타클' };
  return `마이너 아르카나 · ${suits[card.suit]}`;
}

// ── LIST RENDERING ────────────────────────
function renderList() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const list   = document.getElementById('card-list');
  list.innerHTML = '';

  const groups = [
    { key: 'major',     label: '메이저 아르카나 (22장)',      cards: CARDS.filter(c => c.arcana === 'major') },
    { key: 'wands',     label: '완드 (Wands) · 14장',        cards: CARDS.filter(c => c.suit === 'wands') },
    { key: 'cups',      label: '컵 (Cups) · 14장',           cards: CARDS.filter(c => c.suit === 'cups') },
    { key: 'swords',    label: '소드 (Swords) · 14장',       cards: CARDS.filter(c => c.suit === 'swords') },
    { key: 'pentacles', label: '펜타클 (Pentacles) · 14장',  cards: CARDS.filter(c => c.suit === 'pentacles') },
  ];

  groups.forEach(group => {
    if (currentFilter !== 'all' && currentFilter !== group.key) return;

    const filtered = group.cards.filter(c =>
      !search || c.name.includes(search) || c.nameEn.toLowerCase().includes(search)
    );
    if (!filtered.length) return;

    const header = document.createElement('div');
    header.className = 'list-section-header';
    header.textContent = group.label;
    list.appendChild(header);

    filtered.forEach(card => {
      const status = getDataStatus(card.id);
      const item = document.createElement('div');
      item.className = `list-item ${status === 'full' ? 'has-data' : status === 'partial' ? 'partial-data' : ''} ${currentCardId === card.id ? 'active' : ''}`;
      item.innerHTML = `
        <div class="item-dot"></div>
        <div>
          <div class="item-name">${card.name}</div>
          <div class="item-en">${card.nameEn}</div>
        </div>
      `;
      item.onclick = () => selectCard(card.id);
      list.appendChild(item);
    });
  });
}

function filterCards() { renderList(); }

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ── EDITOR ───────────────────────────────
function selectCard(id) {
  // auto-save current before switching
  if (currentCardId !== null) collectCurrentFields();

  currentCardId = id;
  renderList();
  renderEditor();
}

function renderEditor() {
  const card = CARDS.find(c => c.id === currentCardId);
  if (!card) return;

  const main = document.getElementById('editor-main');

  // progress
  const progItems = FORTUNE_TYPES.map(ft => {
    const nKey = `${card.id}_${ft}_norm`;
    const rKey = `${card.id}_${ft}_rev`;
    const nFilled = !!(data[nKey] && data[nKey].trim());
    const rFilled = !!(data[rKey] && data[rKey].trim());
    const cls = nFilled && rFilled ? 'filled' : (nFilled || rFilled ? 'half' : '');
    return `<div class="prog-item"><div class="prog-dot ${cls}"></div>${FORTUNE_LABELS[ft]}</div>`;
  }).join('');

  main.innerHTML = `
    <div class="editor-card-header">
      <div class="card-art-preview" style="${getArtStyle(card)}">${getCardSymbol(card)}</div>
      <div class="card-header-info">
        <h2>${card.name}</h2>
        <div class="en-name">${card.nameEn}</div>
        <span class="arcana-badge ${getArcanaBadgeClass(card)}">${getArcanaBadgeLabel(card)}</span>
      </div>
    </div>

    <div class="progress-indicator">${progItems}</div>

    <div class="fortune-tabs">
      ${FORTUNE_TYPES.map(ft => `
        <button class="fortune-tab ${ft === currentFortune ? 'active' : ''}"
          onclick="switchFortune('${ft}')">${FORTUNE_LABELS[ft]}</button>
      `).join('')}
    </div>

    <div id="fortune-fields"></div>
  `;

  renderFortuneFields();
}

function renderFortuneFields() {
  const card = CARDS.find(c => c.id === currentCardId);
  const ft   = currentFortune;
  const nKey = `${card.id}_${ft}_norm`;
  const rKey = `${card.id}_${ft}_rev`;
  const ph   = FORTUNE_PLACEHOLDERS[ft];

  document.getElementById('fortune-fields').innerHTML = `
    <div class="interp-section">
      <div class="interp-section-header">
        <h3>정방향 해석</h3>
        <span class="char-count" id="norm-count">${(data[nKey] || '').length}자</span>
      </div>
      <textarea id="field-norm" rows="6"
        placeholder="${ph.norm}"
        oninput="onFieldInput('norm')">${escHtml(data[nKey] || '')}</textarea>

      <div class="divider-label"></div>

      <div class="interp-section-header" style="background:linear-gradient(135deg,#FFF8E8,#FFF0F5);">
        <h3>역방향 해석</h3>
        <span class="char-count" id="rev-count">${(data[rKey] || '').length}자</span>
      </div>
      <textarea id="field-rev" rows="6"
        placeholder="${ph.rev}"
        oninput="onFieldInput('rev')">${escHtml(data[rKey] || '')}</textarea>
    </div>

    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="btn btn-save" onclick="saveCurrentCard()" style="flex:1;padding:12px;">
        💾 이 카드 저장
      </button>
      <button class="btn btn-outline" onclick="nextCard()"
        style="background:#F0EAF8;color:var(--purple-dark);border-color:var(--border);padding:12px 16px;">
        다음 카드 →
      </button>
    </div>
  `;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onFieldInput(dir) {
  const el = document.getElementById(`field-${dir}`);
  const count = document.getElementById(`${dir}-count`);
  if (count) count.textContent = el.value.length + '자';
}

function switchFortune(ft) {
  collectCurrentFields();
  currentFortune = ft;
  renderEditor();
}

function collectCurrentFields() {
  if (currentCardId === null) return;
  const normEl = document.getElementById('field-norm');
  const revEl  = document.getElementById('field-rev');
  if (!normEl || !revEl) return;

  const card = CARDS.find(c => c.id === currentCardId);
  data[`${card.id}_${currentFortune}_norm`] = normEl.value;
  data[`${card.id}_${currentFortune}_rev`]  = revEl.value;
}

function saveCurrentCard() {
  collectCurrentFields();
  saveData();
  renderList();
  showToast('저장되었습니다');
}

function saveAll() {
  collectCurrentFields();
  saveData();
  renderList();
  showToast('전체 저장 완료!');
}

function nextCard() {
  collectCurrentFields();
  saveData();
  if (currentCardId === null) return;
  const idx = CARDS.findIndex(c => c.id === currentCardId);
  const next = CARDS[idx + 1];
  if (next) selectCard(next.id);
}

function showToast(msg) {
  const t = document.getElementById('save-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── EXPORT / IMPORT ───────────────────────
function exportData() {
  collectCurrentFields();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'tarot-interpretations.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      data = { ...data, ...imported };
      saveData();
      renderList();
      if (currentCardId !== null) renderEditor();
      showToast('가져오기 완료!');
    } catch {
      alert('올바른 JSON 파일이 아닙니다.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── INIT ──────────────────────────────────
loadData();
renderList();
</script>
</body>
</html>
