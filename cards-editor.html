<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타로 카드 해석 에디터</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F8F5FF;
  --surface: #FFFFFF;
  --purple: #8B7BB8;
  --purple-dark: #6A5A98;
  --rose: #C4908E;
  --gold: #C9A96E;
  --text: #2E2640;
  --text-mid: #5E5472;
  --text-soft: #9188A0;
  --border: #E0D8F0;
  --sidebar-w: 260px;
}
body { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

.topbar {
  background: var(--purple-dark); color: #fff; padding: 12px 20px;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.topbar h1 { font-size: 16px; font-weight: 700; flex: 1; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { padding: 7px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn:active { transform: scale(0.96); }
.btn-outline { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.35); }
.btn-outline:hover { background: rgba(255,255,255,0.25); }
.btn-gold { background: var(--gold); color: #fff; }
.btn-save { background: #5CAD6C; color: #fff; }

.app-layout { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.sidebar-search { padding: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-search input { width: 100%; padding: 7px 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--bg); outline: none; }
.sidebar-search input:focus { border-color: var(--purple); }
.filter-row { padding: 8px 10px; display: flex; gap: 5px; flex-wrap: wrap; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.filter-btn { padding: 4px 9px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text-mid); transition: all 0.15s; }
.filter-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }
.card-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.list-section-header { padding: 8px 12px 3px; font-size: 10px; font-weight: 700; color: var(--text-soft); letter-spacing: 0.8px; text-transform: uppercase; }
.list-item { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; transition: background 0.1s; }
.list-item:hover { background: var(--bg); }
.list-item.active { background: #EDE8FF; border-left-color: var(--purple); }
.item-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.list-item.has-data .item-dot { background: #5CAD6C; }
.list-item.partial-data .item-dot { background: var(--gold); }
.item-name { font-size: 13px; color: var(--text); font-weight: 500; }
.item-en { font-size: 10px; color: var(--text-soft); }

/* EDITOR */
.editor-main { flex: 1; overflow-y: auto; padding: 20px 24px; }
.editor-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-soft); gap: 10px; }
.editor-empty .icon { font-size: 40px; }

.editor-card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.card-art-preview { width: 56px; height: 88px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: rgba(255,255,255,0.6); flex-shrink: 0; border: 2px solid rgba(255,255,255,0.3); }
.card-header-info h2 { font-size: 20px; font-weight: 700; color: var(--text); }
.card-header-info .en-name { font-size: 13px; color: var(--text-soft); margin: 3px 0 6px; }
.arcana-badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.arcana-major { background: #EDE8FF; color: var(--purple-dark); }
.arcana-minor-wands { background: #FFF0E0; color: #A05820; }
.arcana-minor-cups { background: #E0EEFF; color: #285898; }
.arcana-minor-swords { background: #E8EEF5; color: #486888; }
.arcana-minor-pentacles { background: #E8F5E0; color: #387828; }

/* completion bar */
.completion-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.comp-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-soft); }
.comp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.comp-dot.full { background: #5CAD6C; }
.comp-dot.partial { background: var(--gold); }

/* Fortune tabs */
.fortune-tabs { display: flex; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--border); margin-bottom: 14px; }
.fortune-tab { flex: 1; padding: 9px 6px; background: var(--surface); border: none; font-size: 12px; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: all 0.15s; border-right: 1px solid var(--border); }
.fortune-tab:last-child { border-right: none; }
.fortune-tab.active { background: var(--purple); color: #fff; }

/* Position tabs */
.position-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.pos-tab { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--bg); font-size: 12px; font-weight: 600; color: var(--text-soft); cursor: pointer; transition: all 0.15s; }
.pos-tab.active { background: var(--purple); color: #fff; border-color: var(--purple); }
.pos-tab.filled { border-color: #5CAD6C; color: #5CAD6C; }
.pos-tab.filled.active { background: #5CAD6C; color: #fff; border-color: #5CAD6C; }

/* Field sections */
.field-section { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 12px; }
.field-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.field-header.upright { background: linear-gradient(135deg, #F5F0FF, #FFF5F8); }
.field-header.reversed { background: linear-gradient(135deg, #FFF8E8, #FFF0E8); }
.field-header h4 { font-size: 13px; font-weight: 700; color: var(--text); }
.char-count { font-size: 11px; color: var(--text-soft); }
.field-section textarea { width: 100%; padding: 12px 14px; border: none; font-size: 13px; line-height: 1.75; color: var(--text); background: var(--surface); resize: vertical; min-height: 90px; font-family: inherit; outline: none; }
.field-section textarea:focus { background: #FDFCFF; }
.field-section textarea::placeholder { color: #C4BCD0; }

.action-row { display: flex; gap: 8px; margin-top: 4px; }
.btn-save-card { flex: 1; padding: 12px; background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-next { padding: 12px 18px; background: var(--bg); color: var(--text-mid); border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }

.save-toast { position: fixed; bottom: 20px; right: 20px; background: #2E2640; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: all 0.3s; pointer-events: none; z-index: 999; }
.save-toast.show { opacity: 1; transform: translateY(0); }

.pos-name-label { font-size: 11px; color: var(--purple); font-weight: 600; margin-bottom: 8px; padding: 4px 10px; background: #EDE8FF; border-radius: 6px; display: inline-block; }
</style>
</head>

const FORTUNE_TYPES = ['solo','couple','reunion'];

let data = {};
let currentFilter = 'all';
let currentCardId = null;
let currentFortune = 'solo';
let currentPosIdx  = 0;

function loadData() { data = JSON.parse(localStorage.getItem('tarot-interp') || '{}'); }
function saveData() { localStorage.setItem('tarot-interp', JSON.stringify(data)); }

// ── completion tracking ────────────────────
function getCardStatus(cardId) {
  let total = 0, filled = 0;
  FORTUNE_TYPES.forEach(ft => {
    SPREADS[ft].positions.forEach((_, pi) => {
      ['norm','rev'].forEach(dir => {
        total++;
        const k = `${cardId}_${ft}_p${pi}_${dir}`;
        if (data[k] && data[k].trim()) filled++;
      });
    });
  });
  if (filled === 0) return 'empty';
  if (filled === total) return 'full';
  return 'partial';
}

function getPosStatus(cardId, ft, pi) {
  const n = data[`${cardId}_${ft}_p${pi}_norm`];
  const r = data[`${cardId}_${ft}_p${pi}_rev`];
  const nf = !!(n && n.trim());
  const rf = !!(r && r.trim());
  if (nf && rf) return 'full';
  if (nf || rf) return 'partial';
  return 'empty';
}

// ── list ────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const search = (document.getElementById('search-input').value || '').toLowerCase();
  const list   = document.getElementById('card-list');
  list.innerHTML = '';

  const groups = [
    {key:'major',     label:'메이저 아르카나', cards: CARDS.filter(c=>c.arcana==='major')},
    {key:'wands',     label:'완드 (Wands)',     cards: CARDS.filter(c=>c.suit==='wands')},
    {key:'cups',      label:'컵 (Cups)',        cards: CARDS.filter(c=>c.suit==='cups')},
    {key:'swords',    label:'소드 (Swords)',    cards: CARDS.filter(c=>c.suit==='swords')},
    {key:'pentacles', label:'펜타클',           cards: CARDS.filter(c=>c.suit==='pentacles')},
  ];

  groups.forEach(g => {
    if (currentFilter !== 'all' && currentFilter !== g.key) return;
    const filtered = g.cards.filter(c => !search || c.name.includes(search) || c.nameEn.toLowerCase().includes(search));
    if (!filtered.length) return;
    const h = document.createElement('div');
    h.className = 'list-section-header'; h.textContent = g.label;
    list.appendChild(h);
    filtered.forEach(card => {
      const status = getCardStatus(card.id);
      const item   = document.createElement('div');
      item.className = `list-item${status==='full'?' has-data':status==='partial'?' partial-data':''}${currentCardId===card.id?' active':''}`;
      item.innerHTML = `<div class="item-dot"></div><div><div class="item-name">${card.name}</div><div class="item-en">${card.nameEn}</div></div>`;
      item.onclick = () => selectCard(card.id);
      list.appendChild(item);
    });
  });
}

// ── editor ─────────────────────────────────
function selectCard(id) {
  if (currentCardId !== null) collectFields();
  currentCardId = id;
  currentPosIdx = 0;
  renderList();
  renderEditor();
}

function getArtStyle(card) {
  const g={major:'linear-gradient(145deg,#9B8FD4,#6050A8,#8B4E8C)',wands:'linear-gradient(145deg,#E8A058,#C07830)',cups:'linear-gradient(145deg,#6898D8,#4878B8)',swords:'linear-gradient(145deg,#88AACC,#6888AA)',pentacles:'linear-gradient(145deg,#78B868,#589848)'};
  return `background:${g[card.arcana==='major'?'major':card.suit]||g.major}`;
}
function getArcanaClass(card) { return card.arcana==='major'?'arcana-major':`arcana-minor-${card.suit}`; }
function getArcanaLabel(card) { if(card.arcana==='major')return '메이저 아르카나'; const s={wands:'완드',cups:'컵',swords:'소드',pentacles:'펜타클'}; return `마이너 아르카나 · ${s[card.suit]}`; }
function getSymbol(card) { if(card.arcana==='major')return '★'; return{wands:'🔥',cups:'💧',swords:'⚔️',pentacles:'⭐'}[card.suit]||'✦'; }

function renderEditor() {
  const card = CARDS.find(c=>c.id===currentCardId);
  const main = document.getElementById('editor-main');

  // completion summary
  const compItems = FORTUNE_TYPES.map(ft => {
    const total = SPREADS[ft].positions.length * 2;
    let filled  = 0;
    SPREADS[ft].positions.forEach((_,pi) => {
      ['norm','rev'].forEach(dir => {
        if ((data[`${card.id}_${ft}_p${pi}_${dir}`]||'').trim()) filled++;
      });
    });
    const cls = filled===0?'':filled===total?'full':'partial';
    return `<div class="comp-item"><div class="comp-dot ${cls}"></div>${SPREADS[ft].label} (${filled}/${total})</div>`;
  }).join('');

  main.innerHTML = `
    <div class="editor-card-header">
      <div class="card-art-preview" style="${getArtStyle(card)}">${getSymbol(card)}</div>
      <div class="card-header-info">
        <h2>${card.name}</h2>
        <div class="en-name">${card.nameEn}</div>
        <span class="arcana-badge ${getArcanaClass(card)}">${getArcanaLabel(card)}</span>
      </div>
    </div>
    <div class="completion-bar">${compItems}</div>
    <div class="fortune-tabs">
      ${FORTUNE_TYPES.map(ft=>`
        <button class="fortune-tab ${ft===currentFortune?'active':''}" onclick="switchFortune('${ft}')">${SPREADS[ft].label}</button>
      `).join('')}
    </div>
    <div id="pos-tabs-row"></div>
    <div id="pos-fields"></div>
    <div class="action-row">
      <button class="btn-save-card" onclick="saveCard()">💾 저장</button>
      <button class="btn-next" onclick="nextCard()">다음 카드 →</button>
    </div>
  `;

  renderPosTabs();
  renderPosFields();
}

function renderPosTabs() {
  const card = CARDS.find(c=>c.id===currentCardId);
  const positions = SPREADS[currentFortune].positions;
  const row = document.getElementById('pos-tabs-row');
  row.innerHTML = `<div class="position-tabs">
    ${positions.map((p,i)=>{
      const status = getPosStatus(card.id, currentFortune, i);
      return `<button class="pos-tab ${status==='full'?'filled':''} ${i===currentPosIdx?'active':''}"
        onclick="switchPos(${i})">${i+1}번째</button>`;
    }).join('')}
  </div>`;
}

function renderPosFields() {
  const card = CARDS.find(c=>c.id===currentCardId);
  const pos  = SPREADS[currentFortune].positions[currentPosIdx];
  const nKey = `${card.id}_${currentFortune}_p${currentPosIdx}_norm`;
  const rKey = `${card.id}_${currentFortune}_p${currentPosIdx}_rev`;

  document.getElementById('pos-fields').innerHTML = `
    <div style="margin-bottom:10px;">
      <span class="pos-name-label">📌 ${pos.name}</span>
    </div>
    <div class="field-section">
      <div class="field-header upright">
        <h4>정방향 해석</h4>
        <span class="char-count" id="n-count">${(data[nKey]||'').length}자</span>
      </div>
      <textarea id="f-norm" rows="5"
        placeholder="${pos.name} 자리에 이 카드가 정방향으로 나왔을 때의 해석을 작성하세요..."
        oninput="onInput('n-count','f-norm')">${esc(data[nKey]||'')}</textarea>
    </div>
    <div class="field-section">
      <div class="field-header reversed">
        <h4>역방향 해석</h4>
        <span class="char-count" id="r-count">${(data[rKey]||'').length}자</span>
      </div>
      <textarea id="f-rev" rows="5"
        placeholder="${pos.name} 자리에 이 카드가 역방향으로 나왔을 때의 해석을 작성하세요..."
        oninput="onInput('r-count','f-rev')">${esc(data[rKey]||'')}</textarea>
    </div>
  `;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function onInput(countId, fieldId) {
  const el = document.getElementById(fieldId);
  const c  = document.getElementById(countId);
  if (el && c) c.textContent = el.value.length + '자';
}

function switchFortune(ft) { collectFields(); currentFortune = ft; currentPosIdx = 0; renderEditor(); }
function switchPos(pi)     { collectFields(); currentPosIdx = pi; renderPosTabs(); renderPosFields(); }

function collectFields() {
  if (currentCardId === null) return;
  const n = document.getElementById('f-norm');
  const r = document.getElementById('f-rev');
  if (!n || !r) return;
  const card = CARDS.find(c=>c.id===currentCardId);
  data[`${card.id}_${currentFortune}_p${currentPosIdx}_norm`] = n.value;
  data[`${card.id}_${currentFortune}_p${currentPosIdx}_rev`]  = r.value;
}

function saveCard() {
  collectFields(); saveData(); renderList(); renderPosTabs();
  toast('저장되었습니다');
}

function saveAll() {
  collectFields(); saveData(); renderList();
  toast('전체 저장 완료!');
}

function nextCard() {
  collectFields(); saveData();
  const idx  = CARDS.findIndex(c=>c.id===currentCardId);
  const next = CARDS[idx+1];
  if (next) selectCard(next.id);
}

function toast(msg) {
  const t = document.getElementById('save-toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── export / import ─────────────────────────
function exportData() {
  collectFields();
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'tarot-interpretations.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e) {
  const file = e.target.files[0]; if(!file) return;
  const r    = new FileReader();
  r.onload   = ev => {
    try {
      data = { ...data, ...JSON.parse(ev.target.result) };
      saveData(); renderList();
      if (currentCardId!==null) renderEditor();
      toast('가져오기 완료!');
    } catch { alert('올바른 JSON 파일이 아닙니다.'); }
  };
  r.readAsText(file); e.target.value='';
}

loadData();
renderList();
</script>
